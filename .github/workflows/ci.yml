name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run basedpyright
      - name: Run the original experiment
        run: uv run python -m src.intent_revalidation --output "$RUNNER_TEMP/phase1"
      - name: Run the report follow-up study
        run: uv run python -m src.intent_revalidation.report_workflow --output "$RUNNER_TEMP/report-study"
      - name: Reproduce the observed request boundary
        run: PYTHONPATH=. uv run python examples/support-readiness/probe.py "$RUNNER_TEMP/observed-request"
      - name: Run the human-clarified readiness comparison
        run: uv run python -m src.intent_revalidation.readiness_workflow --output "$RUNNER_TEMP/readiness-study"
